<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Francis Mwaniki — Senior Software Engineer</title>
    <meta name="description" content="Senior software engineer in Nairobi building AI platforms, marketplaces and infrastructure. Forge, AI Store, Kandarasi, TalentLens and more." />
    <meta name="theme-color" content="#0a0a0b" />
    <script>
      // Set the theme before first paint so there is no flash.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          var r = document.documentElement;
          r.dataset.theme = t;
          r.style.colorScheme = t;
          document.querySelector('meta[name="theme-color"]').content = t === "light" ? "#f7f5f0" : "#0a0a0b";
        } catch (e) {}
      })();
    </script>
    <style>
      html { background: #0a0a0b; }
      html[data-theme="light"] { background: #f7f5f0; }
    </style>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Francis Mwaniki — Senior Software Engineer" />
    <meta property="og:description" content="I build AI products and the infrastructure that keeps them running." />
    <meta property="og:image" content="/work/forge.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="/work/forge-sm.webp" fetchpriority="low" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
